name: Accessibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # vitest runs under Node: the brain core's tests need node:sqlite (Node >= 22.13).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: web
        run: bun install

      - name: Run accessibility tests (axe-core + ARIA)
        working-directory: web
        run: bun run test:a11y
