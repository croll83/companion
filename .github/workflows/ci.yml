name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: web
        run: bun install

      - name: Dead code guard (unused locals/params)
        working-directory: web
        run: bun run deadcode:check

      - name: DRY guard (duplicate code threshold)
        working-directory: web
        run: bun run dry:check

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # vitest runs under Node: the brain core's tests need node:sqlite (Node >= 22.13).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: web
        run: bun install

      - name: Typecheck
        working-directory: web
        run: bun run typecheck

      - name: Codex protocol contract (offline)
        working-directory: web
        run: bun run test:codex-contract

      - name: Run tests
        working-directory: web
        run: bun run test

      - name: Build frontend
        working-directory: web
        run: bun run build
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}

      - name: Brain bundle smoke test (the built dist/brain/brain.js under Bun)
        working-directory: web
        run: bun run test:brain-smoke
